# Enabled sources and per-source settings. Keys not listed below are passed to the plugin as
# `settings`. Before enabling ANY source, it must pass the checklist in docs/SOURCES.md.
# The owner chooses real listing sites one at a time (GDD Phase 5).

example_html:
  enabled: false
  delay_seconds: 5          # pages (never below 5 for a real site)
  image_delay_seconds: 1    # photo URL checks on image hosts (never below 1)
  max_records_per_run: 50
  image_hosts: ["images.example.test"]
  allow_price_range_midpoint: false
  # Serve backend/tests/fixtures locally to try it:
  #   python -m http.server 8099 -d backend/tests/fixtures
  base_url: http://127.0.0.1:8099/
