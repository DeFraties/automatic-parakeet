<!doctype html>
<html><head><title>Kuća, Split — Example Listings (FICTIONAL fixture)</title></head>
<body>
  <!-- No embedded JSON here: the plugin falls back to HTML selectors.
       Priced in kuna, which the pipeline converts to euro at 7.53450. -->
  <article class="listing" data-listing-id="EX-2002">
    <h1 class="title">Family house with garden</h1>
    <div class="price">kn 1.507.000</div>
    <ul class="facts">
      <li class="type">Kuća (house)</li>
      <li class="area">1,615 sq ft</li>
      <li class="beds">4</li>
      <li class="baths">2</li>
      <li class="year">1998</li>
    </ul>
    <span class="locality" data-city="Split" data-region="Split-Dalmatia" data-country="HR">Split</span>
    <!-- The site's own map widget, deliberately blurred by the site -> 'approximate' -->
    <div class="map" data-lat="43.5081" data-lng="16.4402" data-approximate="true"></div>
    <!-- Photos in listing order. The site publishes 800 px and 1600 px versions; pick the
         largest the site already publishes that is <= 1600 px. -->
    <ul class="gallery">
      <li><img data-src="https://images.example.test/ex-2002/a_800.jpg" data-src-large="https://images.example.test/ex-2002/a_1600.jpg" alt=""></li>
      <li><img data-src="https://images.example.test/ex-2002/b_800.jpg" data-src-large="https://images.example.test/ex-2002/b_1600.jpg" alt=""></li>
      <li><img data-src="https://images.example.test/ex-2002/c_800.jpg" alt=""></li>
      <li><img data-src="https://images.example.test/ex-2002/plan_800.png" data-kind="floorplan" alt="Floor plan"></li>
    </ul>
    <p class="description">Quiet street, 10 minutes from the sea.</p>
    <div class="agent">Call Ivan Example on +385 00 000 0000</div>
  </article>
</body></html>
