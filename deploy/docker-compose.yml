# Run from the repo root: `make up` (uses ../.env).
name: ballpark

services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: sqlite:///./data/ballpark.db
    volumes:
      - ../data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot: builds the frontend and copies the static files into the `web_dist` volume.
  web:
    build: ../frontend
    volumes:
      - web_dist:/out

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  web_dist:
  caddy_data:
  caddy_config:
